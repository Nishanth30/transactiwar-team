<IfModule mod_ssl.c>
    <VirtualHost *:8443>
        ServerName localhost
        DocumentRoot /var/www/html/public

        SSLEngine on
        SSLCertificateFile ${TLS_CERT_FILE}
        SSLCertificateKeyFile ${TLS_KEY_FILE}
        SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
        SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!CAMELLIA
        SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
        SSLHonorCipherOrder Off
        SSLCompression Off
        SSLSessionTickets Off
        SSLUseStapling Off

        # D4 FIX: Tighten slowloris protection using built-in reqtimeout module.
        # Terminate slow-drip connections that hold worker slots open.
        <IfModule reqtimeout_module>
            RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
        </IfModule>

        <Directory /var/www/html/public>
            Options -Indexes +FollowSymLinks
            # M3 FIX: Restrict to only the directive categories .htaccess files
            # actually use. "All" let an attacker-written .htaccess re-enable PHP
            # execution, create rewrites to internal paths, or override auth.
            AllowOverride FileInfo AuthConfig Options=ExecCGI,Indexes
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>
