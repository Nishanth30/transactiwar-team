<IfModule mod_ssl.c>
    <VirtualHost *:8443>
        ServerName localhost
        DocumentRoot /var/www/html/public

        SSLEngine on
        SSLCertificateFile ${TLS_CERT_FILE}
        SSLCertificateKeyFile ${TLS_KEY_FILE}
        SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
        SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!CAMELLIA
        SSLOpenSSLConfCmd Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
        SSLHonorCipherOrder Off
        SSLCompression Off
        SSLSessionTickets Off
        SSLUseStapling Off

        <Directory /var/www/html/public>
            Options -Indexes -ExecCGI +FollowSymLinks
            # M3 FIX: Restrict to only the directive categories .htaccess files
            # actually use. "All" let an attacker-written .htaccess re-enable PHP
            # execution, create rewrites to internal paths, or override auth.
            # ExecCGI is disabled above and not overridable via .htaccess.
            AllowOverride FileInfo AuthConfig Options=Indexes
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>
