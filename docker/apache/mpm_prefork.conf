# D2 FIX: Tuned prefork MPM for 1 CPU / 512MB container.
# Defaults (150 workers, unlimited child lifetime) allowed attackers to
# spawn 150 concurrent PHP processes, each creating a session file,
# exhausting the /tmp tmpfs in seconds.
<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers       50
    MaxConnectionsPerChild 500
</IfModule>
