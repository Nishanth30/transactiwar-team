name: team-17

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    init: true
    command: ["mysqld", "--local-infile=0", "--skip-name-resolve"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_database}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in docker/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  setup:
    image: mysql:8.4
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_database}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in docker/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS:-60}
      DB_WAIT_SLEEP_SECONDS: ${DB_WAIT_SLEEP_SECONDS:-2}
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./setup.sh:/setup.sh:ro
    networks:
      - backend

  app:
    image: team-17
    container_name: team-17
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    # M10 FIX: Make the container filesystem read-only so an attacker who
    # achieves RCE cannot modify PHP files, Apache configs, or plant backdoors.
    # tmpfs mounts provide the writable scratch space Apache and PHP need.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
      - /var/run/apache2:noexec,nosuid,size=1M
      - /var/lock/apache2:noexec,nosuid,size=1M
      - /var/log/apache2:noexec,nosuid,size=32M
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      # H6 FIX: Container listens on unprivileged ports (8080/8443) so
      # the entire process runs as www-data. Docker maps host→container.
      - "${APP_BIND:-0.0.0.0}:80:8080"
      - "${APP_BIND:-0.0.0.0}:443:8443"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in docker/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_database}
      APP_DIAGNOSTIC_MODE: ${APP_DIAGNOSTIC_MODE:-0}
      APP_PORT: 443
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in docker/.env}
      CSRF_ALLOWED_ORIGIN: ${CSRF_ALLOWED_ORIGIN:-https://localhost}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-1}
      GENERATE_SELF_SIGNED_TLS: ${GENERATE_SELF_SIGNED_TLS:-1}
      TLS_CERT_FILE: /etc/apache2/ssl/server.crt
      TLS_KEY_FILE: /etc/apache2/ssl/server.key
      TLS_CERT_CN: ${TLS_CERT_CN:-localhost}
      TLS_CERT_SAN: "${TLS_CERT_SAN:-DNS:localhost,IP:127.0.0.1,IP:::1}"
      TLS_SELF_SIGNED_DAYS: ${TLS_SELF_SIGNED_DAYS:-30}
    # H7 FIX: Mount only the directories the application needs instead of
    # the entire repo. The old "../:/var/www/html:ro" mount exposed .git/,
    # scripts/debug/, reports/pentest/, and other sensitive paths inside the
    # container. The certs mount is now read-only to prevent an attacker
    # from overwriting TLS certificates after a container compromise.
    volumes:
      - ../public:/var/www/html/public:ro
      - ../includes:/var/www/html/includes:ro
      - ../config:/var/www/html/config:ro
      - ../storage:/var/www/html/storage
      # Writable so the entrypoint can generate self-signed certs on first
      # run. For production: pre-provision certs and add :ro here.
      - ./certs:/etc/apache2/ssl
    networks:
      - backend
      - frontend

volumes:
  mysql_data:

networks:
  backend:
    internal: true
  frontend:
